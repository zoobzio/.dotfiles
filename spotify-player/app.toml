# spotify_player configuration
# Docs: https://github.com/aome510/spotify-player/blob/master/docs/config.md
#
# First run: `spotify_player authenticate`
# Daemon mode: `spotify_player -d`
# CLI commands: `spotify_player playback`, `spotify_player get`, etc.

# Use spotify_player's recommended built-in client (ncspot's, extended-quota
# mode). The docs advise AGAINST a custom client_id (newly-registered apps hit
# 429/403). This is also the client the `authenticate` flow uses internally, so
# streaming + Web API share one pre-registered client and NO Spotify dashboard
# setup is needed. client_id must be a TOP-LEVEL key (no [client] table).
client_id = "65b708073fc0480ea92a077233ca87bd"
theme = "dracula"

[device]
name = "spotify_player"
volume = 70
